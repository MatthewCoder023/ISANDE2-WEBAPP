<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users &amp; Roles — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <a href="/admin" class="brand" data-brand-link>
        <img src="/images/logo.png" alt="" class="brand-logo" />
        <span>Flavor &amp; Color</span>
      </a>

      <nav class="dash-nav" aria-label="Main navigation" data-nav></nav>

      <div class="dash-sidebar-footer">
        <div class="dash-user">
          <span class="dash-user-avatar" data-user-initials></span>
          <div>
            <div class="dash-user-name" data-user-name></div>
            <div class="dash-user-role" data-user-role></div>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Users &amp; Roles</h1>
        <span class="badge badge-danger" data-user-role></span>
      </header>

      <main class="dash-content">
        <section class="card">
          <div class="toolbar">
            <input type="search" id="search-input" class="form-input toolbar-search"
                   placeholder="Search name or email…" aria-label="Search users" />
            <select id="role-filter" class="form-input form-select" aria-label="Filter by role">
              <option value="">All roles</option>
              <option value="client">Customer</option>
              <option value="cashier">Cashier / Secretary</option>
              <option value="paint_mixer">Paint Mixer</option>
              <option value="admin">System Administrator</option>
            </select>
            <select id="status-filter" class="form-input form-select" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Deactivated</option>
            </select>
            <span class="toolbar-spacer"></span>
            <button type="button" id="add-user-btn" class="btn btn-primary">
              <span data-icon="plus"></span> New Account
            </button>
          </div>
        </section>

        <section class="card card--flush">
          <div class="table-wrap">
            <table class="table" aria-label="Users">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Contact</th>
                  <th>Role</th>
                  <th>Joined</th>
                  <th>Status</th>
                  <th><span class="visually-hidden">Actions</span></th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-state-icon" data-icon="users" data-icon-size="34"></div>
            <p>No users match your filters.</p>
          </div>
          <div id="pagination" class="pagination"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Create / edit user modal -->
  <div class="modal-backdrop" id="user-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
      <header class="modal-header">
        <h2 class="modal-title" id="user-modal-title">New Account</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">×</button>
      </header>
      <div class="modal-body">
        <form id="user-form" novalidate>
          <input type="hidden" name="userId" />

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="u-first">First name</label>
              <input class="form-input" type="text" id="u-first" name="firstName" maxlength="50" required />
              <p class="form-error" data-error-for="firstName"></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="u-last">Last name</label>
              <input class="form-input" type="text" id="u-last" name="lastName" maxlength="50" required />
              <p class="form-error" data-error-for="lastName"></p>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="u-email">Email</label>
            <input class="form-input" type="email" id="u-email" name="email" required />
            <p class="form-error" data-error-for="email"></p>
            <p class="form-hint" id="email-hint" hidden>Email is the login identity and cannot be changed.</p>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="u-phone">Phone <span class="text-muted">(optional)</span></label>
              <input class="form-input" type="tel" id="u-phone" name="phone" maxlength="20" />
              <p class="form-error" data-error-for="phone"></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="u-role">Role</label>
              <select class="form-input form-select" id="u-role" name="role">
                <option value="cashier">Cashier / Secretary</option>
                <option value="paint_mixer">Paint Mixer</option>
                <option value="admin">System Administrator</option>
                <option value="client">Customer</option>
              </select>
              <p class="form-error" data-error-for="role"></p>
            </div>
          </div>

          <div class="form-group" id="password-group">
            <label class="form-label" for="u-password">Temporary password</label>
            <input class="form-input" type="text" id="u-password" name="password"
                   placeholder="At least 8 characters, a letter and a number" />
            <p class="form-error" data-error-for="password"></p>
            <p class="form-hint">Share this with the employee and ask them to keep it safe.</p>
          </div>
        </form>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" form="user-form" class="btn btn-primary" id="user-save-btn">Save</button>
      </footer>
    </div>
  </div>

  <!-- Reset password modal -->
  <div class="modal-backdrop" id="password-modal" hidden>
    <div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
      <header class="modal-header">
        <h2 class="modal-title" id="password-modal-title">Reset Password</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">×</button>
      </header>
      <div class="modal-body">
        <p style="margin-bottom: 1.125rem;">
          Set a new password for <strong id="password-user-name"></strong>.
        </p>
        <form id="password-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="p-new-password">New password</label>
            <input class="form-input" type="text" id="p-new-password" name="password"
                   placeholder="At least 8 characters, a letter and a number" required />
            <p class="form-error" data-error-for="password"></p>
          </div>
        </form>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" form="password-form" class="btn btn-primary" id="password-save-btn">Reset Password</button>
      </footer>
    </div>
  </div>

  <!-- Deactivate / restore confirmation -->
  <div class="modal-backdrop" id="confirm-modal" hidden>
    <div class="modal modal--sm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title">
      <header class="modal-header">
        <h2 class="modal-title" id="confirm-modal-title">Please confirm</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">×</button>
      </header>
      <div class="modal-body">
        <p id="confirm-message"></p>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-btn">Confirm</button>
      </footer>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/admin-users.js"></script>
</body>
</html>
