<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <a href="/admin" class="brand" data-brand-link>
        <img src="/images/logo.png" alt="" class="brand-logo" />
        <span>Flavor &amp; Color</span>
      </a>

      <nav class="dash-nav" aria-label="Main navigation" data-nav></nav>

      <div class="dash-sidebar-footer">
        <div class="dash-user">
          <span class="dash-user-avatar" data-user-initials></span>
          <div>
            <div class="dash-user-name" data-user-name></div>
            <div class="dash-user-role" data-user-role></div>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Admin Console</h1>
        <span class="badge badge-danger" data-user-role></span>
      </header>

      <main class="dash-content">
        <section class="dash-welcome">
          <h2>Welcome, <span data-user-first-name></span>!</h2>
          <p>Full overview of Flavor &amp; Color operations.</p>
        </section>

        <section class="stat-grid" aria-label="Business overview">
          <div class="card stat-card">
            <span class="stat-icon stat-icon-success" aria-hidden="true" data-icon="peso" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="revenueThisMonth">—</div>
              <div class="stat-label">Revenue This Month</div>
            </div>
          </div>
          <div class="card stat-card">
            <span class="stat-icon stat-icon-primary" aria-hidden="true" data-icon="package" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="totalOrders">—</div>
              <div class="stat-label">Total Orders</div>
            </div>
          </div>
          <div class="card stat-card">
            <span class="stat-icon stat-icon-info" aria-hidden="true" data-icon="users" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="registeredUsers">—</div>
              <div class="stat-label">Registered Users</div>
            </div>
          </div>
          <div class="card stat-card">
            <span class="stat-icon stat-icon-warning" aria-hidden="true" data-icon="tag" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="stockAlerts">—</div>
              <div class="stat-label">Low / Out of Stock</div>
            </div>
          </div>
        </section>

        <section class="card">
          <h3 class="card-title">Administration</h3>
          <p class="card-subtitle" style="margin-bottom: 1rem;">
            Manage accounts, dig into the numbers, or adjust how the shop runs.
          </p>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a href="/admin/users" class="btn btn-primary"><span data-icon="users"></span> Users &amp; Roles</a>
            <a href="/admin/reports" class="btn btn-outline"><span data-icon="bar-chart"></span> Reports</a>
            <a href="/admin/settings" class="btn btn-outline"><span data-icon="settings"></span> Settings</a>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/admin-dashboard.js"></script>
</body>
</html>
