<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Admin Console</h1>
        <span class="badge badge-danger" data-user-role></span>
      </header>

      <main class="dash-content">
        <section class="dash-welcome">
          <h2>Welcome, <span data-user-first-name></span>!</h2>
          <p>Full overview of Flavor &amp; Color operations.</p>
        </section>

        <section class="stat-grid" aria-label="Business overview">
          <a class="card stat-card" data-accent="success" href="/admin/reports" title="Open the sales report">
            <div class="stat-head">
              <span class="stat-icon" data-icon="banknote" data-icon-size="17"></span>
              <span class="stat-label">Revenue This Month</span>
            </div>
            <div class="stat-value" data-stat="revenueThisMonth">—</div>
            <div class="stat-meta" data-meta="revenueThisMonth"></div>
          </a>
          <a class="card stat-card" href="/orders" title="View all orders">
            <div class="stat-head">
              <span class="stat-icon" data-icon="package" data-icon-size="17"></span>
              <span class="stat-label">Total Orders</span>
            </div>
            <div class="stat-value" data-stat="totalOrders">—</div>
            <div class="stat-meta" data-meta="totalOrders"></div>
          </a>
          <a class="card stat-card" data-accent="info" href="/admin/users" title="Manage users and roles">
            <div class="stat-head">
              <span class="stat-icon" data-icon="users" data-icon-size="17"></span>
              <span class="stat-label">Registered Users</span>
            </div>
            <div class="stat-value" data-stat="registeredUsers">—</div>
            <div class="stat-meta" data-meta="registeredUsers"></div>
          </a>
          <a class="card stat-card" data-accent="warning" href="/admin/products?stock=alert" title="View low and out-of-stock products">
            <div class="stat-head">
              <span class="stat-icon" data-icon="alert-triangle" data-icon-size="17"></span>
              <span class="stat-label">Low / Out of Stock</span>
            </div>
            <div class="stat-value" data-stat="stockAlerts">—</div>
            <div class="stat-meta" data-meta="stockAlerts"></div>
          </a>
        </section>

        <section class="widget-grid" aria-label="Operations">
          <div class="card widget" data-widget="revenue"></div>
          <div class="card widget" data-widget="pipeline"></div>
          <div class="card widget" data-widget="alerts"></div>
          <div class="card widget" data-widget="recent"></div>
        </section>

        <section class="card">
          <h3 class="card-title">Administration</h3>
          <p class="card-subtitle" style="margin-bottom: 1rem;">
            Manage accounts, dig into the numbers, or adjust how the shop runs.
          </p>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a href="/admin/users" class="btn btn-primary"><span data-icon="users"></span> Users &amp; Roles</a>
            <a href="/admin/reports" class="btn btn-outline"><span data-icon="bar-chart"></span> Reports</a>
            <a href="/admin/settings" class="btn btn-outline"><span data-icon="settings"></span> Settings</a>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/admin-dashboard.js"></script>
</body>
</html>
