<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <a href="/dashboard" class="brand" data-brand-link>
        <img src="/images/logo.png" alt="" class="brand-logo" />
        <span>Flavor &amp; Color</span>
      </a>

      <nav class="dash-nav" aria-label="Main navigation" data-nav></nav>

      <div class="dash-sidebar-footer">
        <div class="dash-user">
          <span class="dash-user-avatar" data-user-initials></span>
          <div>
            <div class="dash-user-name" data-user-name></div>
            <div class="dash-user-role" data-user-role></div>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Customers</h1>
        <span class="badge" data-user-role></span>
      </header>

      <main class="dash-content">
        <section class="card">
          <div class="toolbar">
            <input type="search" id="search-input" class="form-input toolbar-search"
                   placeholder="Search name or email…" aria-label="Search customers" />
          </div>
        </section>

        <section class="card card--flush">
          <div class="table-wrap">
            <table class="table" aria-label="Customers">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Contact</th>
                  <th>Joined</th>
                  <th>Orders</th>
                  <th class="num">Total Spent</th>
                  <th>Last Order</th>
                  <th><span class="visually-hidden">Actions</span></th>
                </tr>
              </thead>
              <tbody id="customers-tbody"></tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-state-icon" data-illustration="no-results"></div>
            <p>No customers match your search.</p>
          </div>
          <div id="pagination" class="pagination"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Customer order history modal -->
  <div class="modal-backdrop" id="history-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="history-modal-title">
      <header class="modal-header">
        <h2 class="modal-title" id="history-modal-title">Order History</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">×</button>
      </header>
      <div class="modal-body">
        <p style="margin-bottom: 1rem;">
          <strong id="history-customer-name"></strong><br />
          <span class="text-muted" style="font-size: 0.875rem;" id="history-customer-meta"></span>
        </p>
        <div class="table-wrap">
          <table class="table" aria-label="Customer orders">
            <thead>
              <tr><th>Order #</th><th>Placed</th><th>Total</th><th>Status</th></tr>
            </thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>
        <p id="history-empty" class="text-muted" style="padding: 1rem 0;" hidden>
          No orders yet from this customer.
        </p>
        <div id="history-pagination" class="pagination"></div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Close</button>
      </footer>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/staff-customers.js"></script>
</body>
</html>
