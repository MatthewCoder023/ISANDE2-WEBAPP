<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Point of Sale — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/pos.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <a href="/" class="brand" data-brand-link>
        <img src="/images/logo.png" alt="" class="brand-logo" />
        <span>Flavor &amp; Color</span>
      </a>

      <nav class="dash-nav" aria-label="Main navigation" data-nav></nav>

      <div class="dash-sidebar-footer">
        <div class="dash-user">
          <span class="dash-user-avatar" data-user-initials></span>
          <div>
            <div class="dash-user-name" data-user-name></div>
            <div class="dash-user-role" data-user-role></div>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Point of Sale</h1>
        <span class="badge" data-user-role></span>
      </header>

      <main class="dash-content">
        <div class="pos-layout">
          <!-- Product picker -->
          <section class="card">
            <input type="search" id="pos-search" class="form-input"
                   placeholder="Search products by name, SKU, or color…" aria-label="Search products" />
            <div id="pos-products" class="pos-picker-list" aria-label="Available products"></div>
          </section>

          <!-- Current sale -->
          <section class="card">
            <h2 class="card-title" style="margin-bottom: 1rem;">Current Sale</h2>

            <div id="sale-lines" class="pos-sale-lines">
              <div id="sale-empty" class="empty-state" style="padding: 2rem 1rem;">
                <div class="empty-state-icon" data-icon="shopping-cart" data-icon-size="34"></div>
                <p>Click a product to add it to the sale.</p>
              </div>
            </div>

            <div class="pos-total-row">
              <span>Total</span>
              <span id="sale-total">₱0.00</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="pos-customer">Customer name <span class="text-muted">(optional)</span></label>
              <input class="form-input" type="text" id="pos-customer" maxlength="80" placeholder="Walk-in Customer" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="pos-method">Payment method</label>
                <select class="form-input form-select" id="pos-method">
                  <option value="cash">Cash</option>
                  <option value="gcash">GCash</option>
                  <option value="card">Card</option>
                </select>
              </div>
              <div class="form-group" id="tendered-group">
                <label class="form-label" for="pos-tendered">Amount tendered (₱)</label>
                <input class="form-input" type="number" id="pos-tendered" min="0" step="0.01" />
              </div>
            </div>

            <div class="pos-change-row" id="change-row" hidden>
              <span>Change</span>
              <span id="change-amount">₱0.00</span>
            </div>

            <button type="button" class="btn btn-primary btn-block" id="complete-sale-btn" disabled>
              Complete Sale
            </button>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/pos.js"></script>
</body>
</html>
