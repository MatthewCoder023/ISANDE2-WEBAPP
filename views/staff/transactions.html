<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Transactions</h1>
        <span class="badge" data-user-role></span>
      </header>

      <main class="dash-content">
        <section class="card">
          <div class="toolbar">
            <input type="search" id="search-input" class="form-input toolbar-search"
                   placeholder="Search by order #…" aria-label="Search transactions" />
            <select id="method-filter" class="form-input form-select" aria-label="Filter by payment method">
              <option value="">All methods</option>
              <option value="cash">Cash</option>
              <option value="gcash">GCash</option>
              <option value="card">Card</option>
            </select>
            <span class="toolbar-spacer"></span>
            <button type="button" id="export-btn" class="btn btn-outline">
              <span data-icon="download"></span> Export CSV
            </button>
            <button type="button" id="export-xlsx-btn" class="btn btn-outline"
                    title="Branded workbook with the sheet locked against casual edits">
              <span data-icon="download"></span> Export Excel
            </button>
          </div>
        </section>

        <section class="card card--flush">
          <div class="table-wrap">
            <table class="table" aria-label="Transactions">
              <thead id="transactions-thead">
                <tr>
                  <th scope="col" data-sort-asc="oldest" data-sort-desc="newest" data-sort-default="desc">Date &amp; Time</th>
                  <th scope="col">Order #</th>
                  <th scope="col" data-sort-asc="method">Method</th>
                  <th scope="col" class="num" data-sort-asc="amount_asc" data-sort-desc="amount_desc" data-sort-default="desc">Amount</th>
                  <th scope="col" class="num">Tendered</th>
                  <th scope="col" class="num">Change</th>
                  <th scope="col">Received By</th>
                </tr>
              </thead>
              <tbody id="transactions-tbody"></tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-state-icon" data-illustration="no-history"></div>
            <p>No transactions yet.</p>
          </div>
          <div id="pagination" class="pagination"></div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/staff-transactions.js"></script>
</body>
</html>
