<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Products — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/products.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <a href="/client" class="brand" data-brand-link>
        <img src="/images/logo.png" alt="" class="brand-logo" />
        <span>Flavor &amp; Color</span>
      </a>

      <nav class="dash-nav" aria-label="Main navigation" data-nav></nav>

      <div class="dash-sidebar-footer">
        <div class="dash-user">
          <span class="dash-user-avatar" data-user-initials></span>
          <div>
            <div class="dash-user-name" data-user-name></div>
            <div class="dash-user-role" data-user-role></div>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Browse Products</h1>
        <button type="button" id="cart-btn" class="btn btn-outline">
          <span data-icon="shopping-cart"></span> Cart <span class="badge badge-primary" id="cart-count">0</span>
        </button>
      </header>

      <main class="dash-content">
        <section class="card">
          <div class="toolbar">
            <input type="search" id="search-input" class="form-input toolbar-search"
                   placeholder="Search paints and supplies…" aria-label="Search products" />
            <select id="category-filter" class="form-input form-select" aria-label="Filter by category">
              <option value="">All categories</option>
            </select>
            <select id="sort-select" class="form-input form-select" aria-label="Sort products">
              <option value="name">Name A–Z</option>
              <option value="newest">Newest</option>
              <option value="price_asc">Price: low to high</option>
              <option value="price_desc">Price: high to low</option>
            </select>
          </div>
        </section>

        <section id="product-grid" class="product-grid" aria-label="Product catalog"></section>

        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-state-icon" data-illustration="no-results"></div>
          <p>No products match your search.</p>
        </div>

        <div id="pagination" class="pagination"></div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/client-products.js"></script>
</body>
</html>
