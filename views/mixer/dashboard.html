<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mixing Station — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <a href="/mixer" class="brand" data-brand-link>
        <img src="/images/logo.png" alt="" class="brand-logo" />
        <span>Flavor &amp; Color</span>
      </a>

      <nav class="dash-nav" aria-label="Main navigation" data-nav></nav>

      <div class="dash-sidebar-footer">
        <div class="dash-user">
          <span class="dash-user-avatar" data-user-initials></span>
          <div>
            <div class="dash-user-name" data-user-name></div>
            <div class="dash-user-role" data-user-role></div>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Mixing Station</h1>
        <span class="badge badge-warning" data-user-role></span>
      </header>

      <main class="dash-content">
        <section class="dash-welcome">
          <h2>Hello, <span data-user-first-name></span>!</h2>
          <p>Your paint production workspace at a glance.</p>
        </section>

        <section class="stat-grid" aria-label="Production overview">
          <a class="card stat-card" href="/mixing?status=queued" title="View the queued mixes">
            <span class="stat-icon stat-icon-warning" aria-hidden="true" data-icon="flask-conical" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="queued">—</div>
              <div class="stat-label">Queued Mixes</div>
            </div>
          </a>
          <a class="card stat-card" href="/mixing?status=mixing" title="View mixes on the bench">
            <span class="stat-icon stat-icon-info" aria-hidden="true" data-icon="droplets" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="mixing">—</div>
              <div class="stat-label">On the Bench</div>
            </div>
          </a>
          <a class="card stat-card" href="/mixing/log" title="Open the production log">
            <span class="stat-icon stat-icon-success" aria-hidden="true" data-icon="check-circle" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="completedToday">—</div>
              <div class="stat-label">Completed Today</div>
            </div>
          </a>
          <a class="card stat-card" href="/mixing/formulas" title="Browse saved colour formulas">
            <span class="stat-icon stat-icon-primary" aria-hidden="true" data-icon="palette" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="formulas">—</div>
              <div class="stat-label">Saved Formulas</div>
            </div>
          </a>
        </section>

        <section class="card">
          <h3 class="card-title">Quick actions</h3>
          <p class="card-subtitle" style="margin-bottom: 1rem;">
            Work the queue, look up a recipe, or review past mixes.
          </p>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a href="/mixing" class="btn btn-primary"><span data-icon="flask-conical"></span> Open Queue</a>
            <a href="/mixing/formulas" class="btn btn-outline"><span data-icon="droplets"></span> Color Formulas</a>
            <a href="/mixing/log" class="btn btn-outline"><span data-icon="clipboard-list"></span> Production Log</a>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/mixer-dashboard.js"></script>
</body>
</html>
