<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Desk — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Sales Desk</h1>
        <span class="badge badge-info" data-user-role></span>
      </header>

      <main class="dash-content">
        <section class="dash-welcome">
          <h2>Hello, <span data-user-first-name></span>!</h2>
          <p>Today's sales and order activity at a glance.</p>
        </section>

        <section class="stat-grid" aria-label="Sales overview">
          <a class="card stat-card" data-accent="success" href="/transactions" title="View today's transactions">
            <div class="stat-head">
              <span class="stat-icon" data-icon="banknote" data-icon-size="17"></span>
              <span class="stat-label">Sales Today</span>
            </div>
            <div class="stat-value" data-stat="salesToday">—</div>
            <div class="stat-meta" data-meta="salesToday"></div>
          </a>
          <a class="card stat-card" data-accent="warning" href="/orders?status=pending_verification" title="Review payments awaiting verification">
            <div class="stat-head">
              <span class="stat-icon" data-icon="shield" data-icon-size="17"></span>
              <span class="stat-label">Awaiting Verification</span>
            </div>
            <div class="stat-value" data-stat="awaitingVerification">—</div>
            <div class="stat-meta" data-meta="awaitingVerification"></div>
          </a>
          <a class="card stat-card" data-accent="info" href="/orders?status=ready" title="View orders ready for pickup">
            <div class="stat-head">
              <span class="stat-icon" data-icon="package" data-icon-size="17"></span>
              <span class="stat-label">Ready for Pickup</span>
            </div>
            <div class="stat-value" data-stat="readyOrders">—</div>
            <div class="stat-meta" data-meta="readyOrders"></div>
          </a>
          <a class="card stat-card" href="/transactions" title="View all transactions">
            <div class="stat-head">
              <span class="stat-icon" data-icon="credit-card" data-icon-size="17"></span>
              <span class="stat-label">Transactions Today</span>
            </div>
            <div class="stat-value" data-stat="transactionsToday">—</div>
            <div class="stat-meta" data-meta="transactionsToday"></div>
          </a>
        </section>

        <section class="widget-grid" aria-label="Today's work">
          <div class="card widget widget--wide" data-widget="pipeline"></div>
          <div class="card widget" data-widget="recent"></div>
          <div class="card widget" data-widget="alerts"></div>
        </section>

        <section class="card">
          <h3 class="card-title">Quick actions</h3>
          <p class="card-subtitle" style="margin-bottom: 1rem;">
            Ring up a walk-in sale, process online orders, or review payments.
          </p>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a href="/pos" class="btn btn-primary"><span data-icon="shopping-cart"></span> New Sale</a>
            <a href="/orders" class="btn btn-outline"><span data-icon="package"></span> Process Orders</a>
            <a href="/transactions" class="btn btn-outline"><span data-icon="credit-card"></span> Transactions</a>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/staff-dashboard.js"></script>
</body>
</html>
