<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Desk — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <a href="/cashier" class="brand" data-brand-link>
        <img src="/images/logo.png" alt="" class="brand-logo" />
        <span>Flavor &amp; Color</span>
      </a>

      <nav class="dash-nav" aria-label="Main navigation" data-nav></nav>

      <div class="dash-sidebar-footer">
        <div class="dash-user">
          <span class="dash-user-avatar" data-user-initials></span>
          <div>
            <div class="dash-user-name" data-user-name></div>
            <div class="dash-user-role" data-user-role></div>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Sales Desk</h1>
        <span class="badge badge-info" data-user-role></span>
      </header>

      <main class="dash-content">
        <section class="dash-welcome">
          <h2>Hello, <span data-user-first-name></span>!</h2>
          <p>Today's sales and order activity at a glance.</p>
        </section>

        <section class="stat-grid" aria-label="Sales overview">
          <div class="card stat-card">
            <span class="stat-icon stat-icon-success" aria-hidden="true" data-icon="peso" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="salesToday">—</div>
              <div class="stat-label">Sales Today</div>
            </div>
          </div>
          <div class="card stat-card">
            <span class="stat-icon stat-icon-primary" aria-hidden="true" data-icon="image" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="awaitingVerification">—</div>
              <div class="stat-label">Awaiting Verification</div>
            </div>
          </div>
          <div class="card stat-card">
            <span class="stat-icon stat-icon-info" aria-hidden="true" data-icon="shopping-bag" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="readyOrders">—</div>
              <div class="stat-label">Ready for Pickup</div>
            </div>
          </div>
          <div class="card stat-card">
            <span class="stat-icon stat-icon-warning" aria-hidden="true" data-icon="credit-card" data-icon-size="22"></span>
            <div>
              <div class="stat-value" data-stat="transactionsToday">—</div>
              <div class="stat-label">Transactions Today</div>
            </div>
          </div>
        </section>

        <section class="card">
          <h3 class="card-title">Quick actions</h3>
          <p class="card-subtitle" style="margin-bottom: 1rem;">
            Ring up a walk-in sale, process online orders, or review payments.
          </p>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a href="/pos" class="btn btn-primary"><span data-icon="shopping-cart"></span> New Sale</a>
            <a href="/orders" class="btn btn-outline"><span data-icon="package"></span> Process Orders</a>
            <a href="/transactions" class="btn btn-outline"><span data-icon="credit-card"></span> Transactions</a>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/staff-dashboard.js"></script>
</body>
</html>
