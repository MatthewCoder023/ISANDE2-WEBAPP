<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Log — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <a href="/dashboard" class="brand" data-brand-link>
        <img src="/images/logo.png" alt="" class="brand-logo" />
        <span>Flavor &amp; Color</span>
      </a>

      <nav class="dash-nav" aria-label="Main navigation" data-nav></nav>

      <div class="dash-sidebar-footer">
        <div class="dash-user">
          <span class="dash-user-avatar" data-user-initials></span>
          <div>
            <div class="dash-user-name" data-user-name></div>
            <div class="dash-user-role" data-user-role></div>
          </div>
        </div>
        <button type="button" id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <h1>Production Log</h1>
        <span class="badge" data-user-role></span>
      </header>

      <main class="dash-content">
        <nav class="page-tabs" aria-label="Production sections">
          <a href="/mixing">Mixing Queue</a>
          <a href="/mixing/formulas">Color Formulas</a>
          <a href="/mixing/log" class="is-active">Production Log</a>
        </nav>

        <section class="card">
          <div class="toolbar">
            <input type="search" id="search-input" class="form-input toolbar-search"
                   placeholder="Search request # or customer…" aria-label="Search production history" />
          </div>
        </section>

        <section class="card card--flush">
          <div class="table-wrap">
            <table class="table" aria-label="Production history">
              <thead>
                <tr>
                  <th>Request #</th>
                  <th>Color</th>
                  <th>Customer</th>
                  <th>Formula Used</th>
                  <th>Finished</th>
                  <th>Outcome</th>
                  <th>Mixer Notes</th>
                </tr>
              </thead>
              <tbody id="log-tbody"></tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-state-icon" data-illustration="no-history"></div>
            <p>No production history yet.</p>
          </div>
          <div id="pagination" class="pagination"></div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/js/pages/dashboard.js"></script>
  <script type="module" src="/js/pages/production-log.js"></script>
</body>
</html>
