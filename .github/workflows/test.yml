name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Track the Node major used in development. The lockfile is written by
      # that npm, and an older npm here has rejected it before — keeping the
      # two aligned removes a whole class of "works locally" failure.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # mongodb-memory-server downloads a mongod binary on first run;
      # caching it keeps CI fast after the first build.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      # Surface the toolchain and, on failure, npm's own log — the run
      # summary alone doesn't say why an install was rejected.
      - name: Install dependencies
        run: |
          node --version && npm --version
          npm ci > /tmp/install.log 2>&1 || {
            cat /tmp/install.log
            echo "::error title=npm ci failed::$(tail -c 1500 /tmp/install.log | tr '\n' ' | ')"
            exit 1
          }

      - run: npm test
