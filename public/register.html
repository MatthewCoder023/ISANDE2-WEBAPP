<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Flavor &amp; Color</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card auth-card--wide">
      <div class="auth-brand">
        <a href="/" aria-label="Back to home"><span class="brand-mark">FC</span></a>
        <div>
          <h1 class="auth-title">Create your account</h1>
          <p class="auth-subtitle">Join Flavor &amp; Color to start ordering</p>
        </div>
      </div>

      <form id="register-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="firstName">First name</label>
            <input class="form-input" type="text" id="firstName" name="firstName"
                   autocomplete="given-name" required />
            <p class="form-error" data-error-for="firstName"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="lastName">Last name</label>
            <input class="form-input" type="text" id="lastName" name="lastName"
                   autocomplete="family-name" required />
            <p class="form-error" data-error-for="lastName"></p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" name="email"
                 autocomplete="email" required />
          <p class="form-error" data-error-for="email"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone number <span class="text-muted">(optional)</span></label>
          <input class="form-input" type="tel" id="phone" name="phone"
                 autocomplete="tel" />
          <p class="form-error" data-error-for="phone"></p>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password"
                   autocomplete="new-password" required />
            <p class="form-error" data-error-for="password"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-input" type="password" id="confirmPassword" name="confirmPassword"
                   autocomplete="new-password" required />
            <p class="form-error" data-error-for="confirmPassword"></p>
          </div>
        </div>
        <p class="form-hint">At least 8 characters, with a letter and a number.</p>

        <div class="form-group" style="margin-top: 1.125rem;">
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </div>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/login">Sign in</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
