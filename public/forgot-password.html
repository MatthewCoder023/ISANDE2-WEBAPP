<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="/" aria-label="Back to home"><img src="/images/logo.png" alt="Flavor &amp; Color logo" class="auth-logo" /></a>
        <div>
          <h1 class="auth-title">Forgot your password?</h1>
          <p class="auth-subtitle">Enter your email and we'll send a reset link</p>
        </div>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" name="email"
                 autocomplete="email" required />
          <p class="form-error" data-error-for="email"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <div id="sent-note" class="empty-state" hidden>
        <p>If that email has an account, a reset link is on its way.
           The link works once and expires in 30 minutes.</p>
      </div>

      <div class="auth-footer">
        <p>Remembered it? <a href="/login">Back to sign in</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/pages/forgot-password.js"></script>
</body>
</html>
