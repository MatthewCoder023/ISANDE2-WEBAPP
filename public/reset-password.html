<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Flavor &amp; Color</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="/" aria-label="Back to home"><img src="/images/logo.png" alt="Flavor &amp; Color logo" class="auth-logo" /></a>
        <div>
          <h1 class="auth-title">Choose a new password</h1>
          <p class="auth-subtitle">Your other devices will be signed out</p>
        </div>
      </div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="newPassword">New password</label>
          <input class="form-input" type="password" id="newPassword" name="newPassword"
                 autocomplete="new-password" required />
          <p class="form-error" data-error-for="newPassword"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm new password</label>
          <input class="form-input" type="password" id="confirmPassword" name="confirmPassword"
                 autocomplete="new-password" required />
          <p class="form-error" data-error-for="confirmPassword"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>

      <div id="invalid-note" class="empty-state" hidden>
        <p>This reset link is invalid or has expired.</p>
        <p><a href="/forgot-password">Request a new one</a></p>
      </div>

      <div class="auth-footer">
        <p><a href="/login">Back to sign in</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
